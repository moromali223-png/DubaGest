name: dubagest
description: "DubaGest — gestion Commerce, Services et Immobilier (mobile-first, offline-first)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # URL web sans « # » (liens d'invitation, retours OAuth) — fait partie du SDK.
  flutter_web_plugins:
    sdk: flutter

  # État + injection de dépendances (sans génération de code).
  flutter_riverpod: ^3.3.2
  # Navigation déclarative avec gardes de routes.
  go_router: ^17.5.0
  # Auth + PostgreSQL distant.
  supabase_flutter: ^2.18.0
  # Base locale : SQLite natif (mobile/desktop), WASM + IndexedDB/OPFS (PWA).
  # Version alignée sur drift_dev (outil de migrations) et sur web/drift_worker.js.
  drift: 2.34.0
  drift_flutter: ^0.3.1
  connectivity_plus: ^7.3.2
  # Préférences légères disponibles avant l'ouverture de la base (langue).
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  # Identifiants générés côté client (création hors-ligne).
  uuid: ^4.6.0
  url_launcher: ^6.3.3
  pdf: ^3.12.0
  printing: ^5.14.3
  fl_chart: ^1.2.0
  image_picker: ^1.2.3
  file_selector: ^1.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Polices des documents PDF (latin + arabe, hors-ligne) — licence OFL.
    - assets/fonts/
    # Icônes et logos de marque DubaGest
    - assets/icons/
